name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web-based APK via WebView wrapper
        run: |
          echo "Preparing web assets..."
          # Ensures index.html is at the root for packaging
          if [ ! -f "index.html" ]; then
            echo "Error: index.html not found at root directory!"
            exit 1
          - name: Build Debug APK placeholder/wrapper
          echo "Building APK package..."
