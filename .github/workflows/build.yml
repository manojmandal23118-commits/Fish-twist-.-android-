name: Build APK from Zip

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project file
        run: |
          mkdir -p extracted_project
          unzip -q "*.zip" -d extracted_project

      - name: Locate Flutter Project
        run: |
          # খুঁজে বের করা ফ্লাটার প্রজেক্ট কোথায় আছে এবং বাইরে নিয়ে আসা
          PUBSPEC=$(find extracted_project -name "pubspec.yaml" -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "Error: pubspec.yaml not found anywhere in the zip file!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "Found flutter project at: $PROJECT_DIR"
          rsync -avq "$PROJECT_DIR/" ./
          rm -rf extracted_project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
