name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate and Verify Web Assets
        run: |
          echo "Searching for index.html in the repository..."
          HTML_PATH=$(find . -name "index.html" | head -n 1)
          
          if [ -z "$HTML_PATH" ]; then
            echo "Error: index.html could not be found anywhere in the repository!"
            exit 1
          else
            echo "Success: Found index.html at: $HTML_PATH"
          fi
          echo "Web project validation complete."
          
