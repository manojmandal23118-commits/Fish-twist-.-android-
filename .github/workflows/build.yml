name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Web Assets and Prepare Build
        run: |
          echo "Checking project files..."
          if [ -f "index.html" ]; then
            echo "Success: index.html found at root directory!"
          else
            echo "Error: index.html not found! Please ensure your web files are in the root."
            exit 1
          fi
          echo "Web project structure is valid and ready."
          
